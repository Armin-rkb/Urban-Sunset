<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Urban Sunset">
  <meta name="theme-color" content="#9f2800">
  <meta name="description" content="Urban Sunset: a pixel-art skater endless runner. Jump, slide and dodge your way through the city.">
  <meta property="og:title" content="Urban Sunset">
  <meta property="og:description" content="Skate through the city at sunset. How far can you go?">
  <meta property="og:image" content="icon-512.png">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1c0703;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font-family: "Courier New", monospace; color: #fff;
    }
    #unity-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: block; background: #9f2800; outline: none; touch-action: none;
    }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 120%, #c24a00 0%, #5a1400 45%, #1c0703 100%);
      transition: opacity .4s ease; z-index: 10;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader img { width: min(46vmin, 300px); height: auto; image-rendering: auto; animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px) scale(1.02); } }
    #bar { width: min(70vw, 360px); height: 14px; border: 3px solid #fff; padding: 3px; box-sizing: content-box; }
    #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd640, #ff7a1a); transition: width .15s; }
    #status { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: .85; text-align: center; padding: 0 16px; }
    .chip {
      position: fixed; z-index: 20; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.45);
      color: #fff; font: bold 13px "Courier New", monospace; letter-spacing: 1px; text-transform: uppercase;
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
    }
    #fs-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%);
      display: none; opacity: .85;
    }
    #rotate-hint {
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%);
      display: none; white-space: nowrap; cursor: default;
    }
    #toast {
      position: fixed; z-index: 30; left: 50%; top: 18%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); border: 2px solid #ffd640; padding: 10px 16px;
      font: bold 14px "Courier New", monospace; letter-spacing: 1px; max-width: 86vw; word-break: break-all;
      opacity: 0; transition: opacity .25s; pointer-events: none; text-align: center;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loader">
    <img src="logo.png" alt="Urban Sunset">
    <div id="bar"><div id="bar-fill"></div></div>
    <div id="status">Loading…</div>
  </div>

  <button id="fs-btn" class="chip" type="button">Fullscreen</button>
  <div id="rotate-hint" class="chip">Turn your phone sideways for the best view</div>
  <div id="toast"></div>

  <script>
    (function () {
      var canvas = document.getElementById("unity-canvas");
      var loader = document.getElementById("loader");
      var fill = document.getElementById("bar-fill");
      var status = document.getElementById("status");
      var fsBtn = document.getElementById("fs-btn");
      var rotateHint = document.getElementById("rotate-hint");
      var toastEl = document.getElementById("toast");
      var toastTimer = 0;

      var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var standalone = window.matchMedia("(display-mode: fullscreen)").matches ||
                       window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

      window.usToast = function (msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
      };

      var ready = false;
      window.usGameReady = function () {
        if (ready) return;
        ready = true;
        loader.classList.add("hidden");
        setTimeout(function () { loader.style.display = "none"; }, 450);
        updateChrome();
        if (isIOS && isTouch && !standalone) {
          setTimeout(function () { window.usToast("Tip: Share → Add to Home Screen to play fullscreen"); }, 1500);
        }
      };

      // ---- Stop the page itself from scrolling, zooming or showing menus while playing ----
      function stop(e) { if (e.cancelable) e.preventDefault(); }
      document.addEventListener("touchmove", stop, { passive: false });
      document.addEventListener("gesturestart", stop, { passive: false });
      document.addEventListener("dblclick", stop, { passive: false });
      document.addEventListener("contextmenu", stop);
      canvas.addEventListener("touchstart", function (e) { if (e.touches.length > 1) stop(e); }, { passive: false });

      // ---- Fullscreen + landscape lock where the browser allows it ----
      var fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
      function inFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
      function goFullscreen() {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) return;
        try {
          var p = req.call(el, { navigationUI: "hide" });
          var lock = function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          };
          if (p && p.then) p.then(lock).catch(function () {}); else lock();
        } catch (e) {}
      }
      fsBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (inFullscreen()) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          goFullscreen();
        }
      });

      var hintDismissed = false;
      rotateHint.addEventListener("click", function () { hintDismissed = true; updateChrome(); });

      function updateChrome() {
        var portrait = window.innerHeight > window.innerWidth;
        fsBtn.style.display = ready && fsEnabled && isTouch && !standalone && !inFullscreen() ? "block" : "none";
        rotateHint.style.display = ready && isTouch && portrait && !hintDismissed ? "block" : "none";
      }
      window.addEventListener("resize", updateChrome);
      document.addEventListener("fullscreenchange", updateChrome);
      document.addEventListener("webkitfullscreenchange", updateChrome);
      setTimeout(function () { hintDismissed = true; updateChrome(); }, 9000);

      // ---- Unity loader ----
      function showBanner(msg, type) {
        if (type === "error") { status.textContent = msg; console.error(msg); }
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Cap the render resolution: sharp on phones without cooking the GPU.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isTouch ? 2 : 2.5)
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.round(progress * 100) + "%";
          status.textContent = progress < 0.9 ? "Loading… " + Math.round(progress * 100) + "%" : "Almost there…";
        }).then(function (instance) {
          window.unityInstance = instance;
          window.usGameReady();
          canvas.focus();
        }).catch(function (message) {
          status.textContent = "Sorry, this browser couldn't start the game. " + message;
        });
      };
      script.onerror = function () { status.textContent = "Could not download the game files."; };
      document.body.appendChild(script);

      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    })();
  </script>
</body>
</html>
